# =============================================================================
# AgentTest 应用配置（config/app.yaml）

# =============================================================================
# 加载方式：
#   - 环境变量 AGENTTEST_CONFIG 指向本文件绝对/相对路径时优先使用；
#   - 未设置时 main 默认读取 config/app.yaml。
# 路径规则：
#   - root 为相对路径解析基准（相对进程启动时工作目录）；
#   - paths / MCP command / workdir 等可写相对 root 的路径，启动时解析为绝对路径。

# =============================================================================

# root: 工程根目录（相对当前工作目录）；"." 表示在运行目录下解析 paths 与各相对路径。
root: "."

# paths: 各类持久化资源与运行时工作区（均相对 root，Load 后解析为绝对路径）。

paths:
  # abilities: 内置技能树定义（Domain/Ability/Skill），供 skill.GlobalManager 加载。
  abilities: "behavior/abilities.yml"
  # memory: 通用 Agent 对话/经验 JSONL 存储路径（部分模块回退使用）。
  memory: "memory/my_agent_memory.jsonl"
  # plan_memory: PlanAgent 跨轮长效记忆 JSONL；超出 plan_max_history 的轮次由 archiver 写入此文件。
  plan_memory: "memory/plan_agent_memory.jsonl"
  # experience: 技能经验库 SQLite（store_skill_experience / recall 等）。
  experience: "experience/experience.db"
  # soul: 静态灵魂/人格 YAML（与 Soul MCP 插件互补，非 MCP 数据目录）。
  soul: "agent/soul/Nexus.yml"
  # workspace: 主工作区；filesystem MCP 根目录、产物默认落盘、PowerShell 技能 cwd 等均指向此处。
  workspace: "WorkSpace"
  # workspace_word: Word 报告类产物子目录（部分 Office 技能约定路径）。
  workspace_word: "WorkSpace/word"
  # workspace_ppt: PPT 产物子目录。
  workspace_ppt: "WorkSpace/ppt"
  # mcp_bundled: 随包 MCP 可执行文件与 node 运行时根目录；capabilities.mcp.servers[].command 可写相对此目录的路径。
  mcp_bundled: "WorkSpace/mcp_bundled"

# models: 注册到 ModelManager 的模型列表（key 供 agents.default_model 引用）。

models:
  - # key: 模型注册名，agents.default_model 填此字符串。
    key: "qwen-onnx"
    # driver: 驱动类型；qwen | qwen-onnx → integrations.dashscope；deepseek_onnx → integrations.deepseek_legacy。
    driver: "qwen"
  - key: "deepSeek-onnx"
    driver: "deepseek_onnx"

# agents: 全局 Agent 默认模型与 RAG 行为。

agents:
  # default_model: 默认推理模型，须与 models[].key 之一对应（主链对话、Plan 拆步等）。
  default_model: "deepSeek-onnx"
  # rag_recall_threshold: 经验/RAG 召回条数阈值（相关模块使用）。
  rag_recall_threshold: 3
  # behavior_zero_state: 为 true 时 Behavior 相关路径使用「零状态」初始化策略（见 behavior 包）。
  behavior_zero_state: false

# integrations: 原 Go 源码硬编码的 API Key/Endpoint 统一外置（主链 Qwen/DeepSeek、TTS、视觉、Embedding）。

integrations:
  dashscope:
    # api_key: 阿里云 DashScope API Key（通义 Chat、联网搜索、TTS、视觉、Embedding）。
    api_key:
    # openai_compatible_base_url: openai-go SDK 基址（Embedding、视觉多模态）。
    openai_compatible_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # chat_completions_endpoint: 直连 HTTP Chat Completions（QwenModel、AI_Search 等）。
    chat_completions_endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
    # chat_model: 通义对话模型名（driver=qwen 时使用）。
    chat_model: "qwen3-max"
    # embedding_model: RAG 向量化模型名。
    embedding_model: "text-embedding-v3"
    # tts_api_url: 语音合成（Text_To_Mic_Speech）接口地址。
    tts_api_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
    # vision_model: 屏幕/复杂视觉分析（VisualAnalysisTool）模型。
    vision_model: "qwen3.5-plus"
    # vision_model_simple: 轻量视觉（OCR、摄像头、工作区图片）模型。
    vision_model_simple: "qwen-vl-plus"
  deepseek_legacy:
    # chat_completions_endpoint: 主链 DeepSeek Chat Completions 完整 URL。
    chat_completions_endpoint: "https://api.deepseek.com/chat/completions"
    # api_key: DeepSeek API Key（driver=deepseek_onnx 主链；与 Memory/Soul MCP 的 flash key 独立）。
    api_key:
    # model: 主链模型 ID。
    model: "deepseek-v4-pro"
    # debug: 为 true 时在控制台打印完整请求/响应（开发调试用）。
    debug: true

# executor: 各 Agent CustomExecutor 的步数、历史、归档与 Plan 编排参数。

executor:
  # dialogue_archive_tokens: 对话 token 超过此值触发 DialogueHistoryArchiver 归档。
  dialogue_archive_tokens: 20000
  # dialogue_archive_rounds: 归档时保留的最近完整对话轮数。
  dialogue_archive_rounds: 3
  # history_tool_rounds_keep: 单次 Run 发给模型的 history 尾部最多保留多少轮「助手+工具结果」（每轮约 2 条 message）。
  history_tool_rounds_keep: 12
  # tool_observation_max_runes: 单轮多工具汇总写入 history 的最大 rune 数；0 用内置默认。
  tool_observation_max_runes: 20000
  # tool_result_line_max_runes: 并行工具结果中单条返回的最大 rune 数；0 用内置默认。
  tool_result_line_max_runes: 20000
  # ai_round_max_runes: 单条助手回复写入 history 的最大 rune（含 reasoning）；0 用内置默认。
  ai_round_max_runes: 24000
  # base_max_steps: baseAgent 单轮 ReAct 最大步数。
  base_max_steps: 4
  # base_max_history: baseAgent 保留对话轮数。
  base_max_history: 4
  # router_max_steps: RouterAgent 单轮最大步数。
  router_max_steps: 12
  # router_max_history: RouterAgent 保留对话轮数。
  router_max_history: 12
  # plan_max_steps: 【已废弃】仅当 plan_prompt_max_steps 未配置时作回退。
  plan_max_steps: 8
  # plan_prompt_max_steps: 写入 PlanAgent 拆步 prompt 的「建议最多几步」提示上限。
  plan_prompt_max_steps: 12
  # plan_max_steps_per_plan: 单份 TodoList JSON 最多保留步骤条数。
  plan_max_steps_per_plan: 24
  # plan_max_dispatch_per_turn: 单轮用户输入下，Plan 最多下发执行多少步（含重试/调节）。
  plan_max_dispatch_per_turn: 40
  # plan_max_adjust_per_step: 单步连续失败后触发 Plan 调节（retry/skip/replace）的次数上限。
  plan_max_adjust_per_step: 4
  # plan_result_summary_max_runes: 步骤结果 summary 写入 TodoList 前的最大 rune。
  plan_result_summary_max_runes: 2000
  # plan_step_detail_max_runes: 步骤 UserVisible 详情写入 TodoList 前的最大 rune。
  plan_step_detail_max_runes: 24000
  # plan_max_history: PlanAgent 内存中保留的最近对话轮数。
  plan_max_history: 8
  # plan_archive_rounds: Plan 对话归档时保留的最近轮数；0 则回退 dialogue_archive_rounds。
  plan_archive_rounds: 3
  # plan_jsonl_rag_enabled: 是否启用 Plan 本地 JSONL RAG（写入 plan_memory）；默认 false，跨会话由 Soul/Memory MCP 承担。
  plan_jsonl_rag_enabled: false
  # plan_step_max_steps: Plan 单步下发给 BehaviorAgent 的 ReAct 最大轮数（每步一个 TodoList 项）。
  plan_step_max_steps: 8
  # behavior_max_steps: BehaviorAgent 单轮 ReAct 最大步数（非 Plan 逐步路径时）。
  behavior_max_steps: 40
  # behavior_max_history: BehaviorAgent 保留对话轮数。
  behavior_max_history: 100
  # exec_simple_enabled: 开启 Exec-Simple 快路径；须 plan_memory_hook 命中且置信度足够才走，否则逐步 Behavior。
  exec_simple_enabled: true
  # exec_simple_max_steps: Exec-Simple 单 episode 最大 ReAct 轮数。
  exec_simple_max_steps: 80
  # exec_simple_max_history: Exec-Simple 保留对话轮数。
  exec_simple_max_history: 240
  # exec_simple_archive_rounds: Exec-Simple 触发归档时保留的最近轮数。
  exec_simple_archive_rounds: 6
  # exec_simple_min_confidence: Memory 经验 retrieve 置信度 ≥ 此值才允许走 Exec-Simple。
  exec_simple_min_confidence: 0.75
  # exec_simple_max_tier: 允许 Exec-Simple 的最高步骤 tier；高于此值强制走逐步 Exec。
  exec_simple_max_tier: 2
  # affective_max_steps: AffectiveInteractiveAgent 单轮最大步数。
  affective_max_steps: 10
  # affective_max_history: AffectiveInteractiveAgent 保留对话轮数。
  affective_max_history: 20
  # behavior_archive_rounds: BehaviorAgent 对话归档保留轮数。
  behavior_archive_rounds: 3
  # router_reflection_max_hops: 同一用户回合内 Router 反思链最大 Agent 跳数；≥ 此值丢弃反思，防无界放大。
  router_reflection_max_hops: 2
  # prompt_time_granularity_seconds: 注入 system 的「当前时间」舍入粒度（秒）；默认 300，设为 1 为秒级实时。
  prompt_time_granularity_seconds: 300
  # disable_api_tool_calls: true 时关闭 API tool_calls，仅文本 ReAct 兜底。
  # disable_api_tool_calls: false
  # disable_progressive_tool_disclosure: true 时初始 tools[] 即包含全部 MCP；默认 false 须 get_capability_details 解锁。
  # disable_progressive_tool_disclosure: false
  # facade_intermediate_agents: 工具循环中允许把模型中间叙述推到用户门面的 Agent 白名单（名称与 Executor.AgentName 一致）。
  facade_intermediate_agents:
    - AffectiveInteractiveAgent
  # plan_delivery: Plan 门户用户可见正文的归纳与进度推送（与 MCP/Exec 工具链解耦）。
  plan_delivery:
    # disable_single_step_synthesize: true 关闭单步交付助手 LLM 归纳。
    # disable_single_step_synthesize: false
    # synthesize_min_runes: 单步展示文本超过此 rune 数才触发归纳；0 默认 400。
    synthesize_min_runes: 400
    # progress_to_portal: true 时每步完成向 WebUI 推送一行进度。
    progress_to_portal: true
    # stream_synthesize_reply: true 时计划编排总结经 SSE 流式推送。
    stream_synthesize_reply: true

# plan_memory_hook: Plan 层 Memory MCP 插件（经验 retrieve 路由 Exec-Simple；回合结束 memory_store）。

plan_memory_hook:
  # enabled: 是否挂载 Memory 插件（仍须 executor.exec_simple_enabled 才参与 simple 路由）。
  enabled: true
  # provider: 插件实现；noop | mcp。
  provider: mcp
  # store_enabled: false 时仅 retrieve 不写回；未写 yaml 时默认 true。
  store_enabled: true
  # mcp_command: memory-mcp 可执行文件（stdio），相对 root 解析。
  mcp_command: "WorkSpace/mcp_bundled/mcp-memory/memory-mcp.exe"
  # mcp_engine: 传给 memory-mcp 的引擎名；factworld 为生产引擎。
  mcp_engine: factworld
  # mcp_env: 子进程环境变量（键值均为字符串）。
  mcp_env:
    # MEMORY_MCP_DATA_DIR: Memory MCP 持久化数据目录。
    MEMORY_MCP_DATA_DIR: "WorkSpace/mcp_data/memory"
    # MEMORY_MCP_LLM_EXTRACT: "1" 启用 LLM 抽取；"0" 退回规则抽取。
    MEMORY_MCP_LLM_EXTRACT: "1"
    # MEMORY_MCP_LLM_API_BASE: DeepSeek API 根 URL（勿重复 /chat/completions）。
    MEMORY_MCP_LLM_API_BASE: "https://api.deepseek.com"
    # MEMORY_MCP_LLM_API_KEY: Memory MCP 专用 LLM Key（可与主链不同，常用 flash 模型降本）。
    MEMORY_MCP_LLM_API_KEY:
    MEMORY_MCP_LLM_MODEL: "deepseek-v4-flash"
    # MEMORY_MCP_ENTITY_MERGE_COSINE: 实体合并余弦阈值（Phase-2d 对齐）。
    MEMORY_MCP_ENTITY_MERGE_COSINE: "0.92"
    # MEMORY_MCP_ENTITY_FUZZY_LOW: 实体模糊匹配下限。
    MEMORY_MCP_ENTITY_FUZZY_LOW: "0.85"
    # MEMORY_MCP_ENTITY_ALIGN_ASYNC: "1" 异步实体对齐。
    MEMORY_MCP_ENTITY_ALIGN_ASYNC: "1"
    # MEMORY_MCP_ENTITY_ALIGN_MIN_ACCESS: 触发对齐的最小访问次数。
    MEMORY_MCP_ENTITY_ALIGN_MIN_ACCESS: "2"
    # MEMORY_MCP_SUPERSEDE_FACTOR: 事实覆盖/取代因子。
    MEMORY_MCP_SUPERSEDE_FACTOR: "0.2"
    # MEMORY_MCP_STALE_DAYS: 陈旧事实退化天数。
    MEMORY_MCP_STALE_DAYS: "30"
    # MEMORY_MCP_L2_CONFLICT: "1" 启用 L2 冲突检测。
    MEMORY_MCP_L2_CONFLICT: "1"
    # MEMORY_MCP_L2_MIN_OLD_WEIGHT: L2 冲突时旧事实最小权重。
    MEMORY_MCP_L2_MIN_OLD_WEIGHT: "0.5"
    # MEMORY_MCP_L2_MAX_CANDIDATES: L2 冲突候选上限。
    MEMORY_MCP_L2_MAX_CANDIDATES: "3"
    # MEMORY_MCP_L2_TIMEOUT_MS: L2 冲突检测超时（毫秒）。
    MEMORY_MCP_L2_TIMEOUT_MS: "15000"
    # MEMORY_MCP_L2_TOPIC_JACCARD: L2 主题 Jaccard 阈值。
    MEMORY_MCP_L2_TOPIC_JACCARD: "0.3"

# plan_soul_hook: Plan 层 Soul MCP 插件（人格/议题 retrieve 与 store）。

plan_soul_hook:
  # enabled: 是否启用 Soul 插件。
  enabled: true
  # provider: noop | mcp。
  provider: mcp
  # store_enabled: 回合结束是否 soul_store；未写时默认 true。
  store_enabled: true
  # mcp_command: soul-mcp 可执行文件（stdio）。
  mcp_command: "WorkSpace/mcp_bundled/mcp-soul/soul-mcp.exe"
  mcp_env:
    # SOUL_MCP_DATA_DIR: Soul MCP 持久化数据目录。
    SOUL_MCP_DATA_DIR: "WorkSpace/mcp_data/soul"
    # SOUL_MCP_ENGINE: 引擎标识。
    SOUL_MCP_ENGINE: "soul"
    # SOUL_MCP_SOUL_DOC: 人格主文档路径（相对 root）。
    SOUL_MCP_SOUL_DOC: "WorkSpace/mcp_bundled/mcp-soul/soul.agent.yaml"
    # SOUL_MCP_AGENT_CONFIG: Agent 配置 YAML 路径。
    SOUL_MCP_AGENT_CONFIG: "WorkSpace/mcp_bundled/mcp-soul/soul-agent.yaml"
    # SOUL_MCP_LLM_EXTRACT: "1" 启用 store 路径 LLM 抽取。
    SOUL_MCP_LLM_EXTRACT: "1"
    # SOUL_MCP_RETRIEVE_LLM: "1" 启用 retrieve 路径 LLM Gate/Compose。
    SOUL_MCP_RETRIEVE_LLM: "1"
    # SOUL_MCP_LLM_API_BASE: Soul MCP 使用的 API 根 URL。
    SOUL_MCP_LLM_API_BASE: "https://api.deepseek.com"
    # SOUL_MCP_LLM_API_KEY: Soul MCP 专用 API Key。
    SOUL_MCP_LLM_API_KEY:
    SOUL_MCP_LLM_MODEL: "deepseek-v4-flash"

# web: 内置 Web 控制台（浏览器交互入口；终端 stdin 已弃用）。

web:
  # enabled: 是否启动 HTTP 服务。
  enabled: true
  # listen: 监听地址，如 ":8765" 或 "127.0.0.1:8765"。
  listen: ":8765"
  # username: WebUI 登录用户名（默认 admin）。
  username: "admin"
  # password: WebUI 登录密码（强烈建议修改；不要暴露到公网）。
  password: ""

# run_view: 旁路监听回合日志，异步 LLM 生成 HTML 推 WebUI 抽屉（不改 Plan/Behavior 主链）。

run_view:
  # enabled: 是否启用运行视图生成。
  enabled: true
  # llm_api_base: 运行视图专用 LLM API 根路径（与 agents.default_model 无关）。
  llm_api_base: "https://api.deepseek.com"
  # llm_api_key: 运行视图专用 API Key。
  llm_api_key:
  # llm_model: 运行视图使用的模型名。
  llm_model: "deepseek-v4-flash"
  # turn_log_dir: 回合日志目录；空则默认 WorkSpace/logs/turns。
  # turn_log_dir: "WorkSpace/logs/turns"
  # output_dir: 生成的 HTML 输出目录。
  output_dir: "WorkSpace/run_views"
  # max_bundle_runes: 送入 LLM 的回合 bundle 最大 rune 数。
  max_bundle_runes: 12000
  # debounce_ms: 同一 turn 多次写入时的防抖毫秒。
  debounce_ms: 600
  # llm_timeout_sec: 单次 LLM 请求超时（秒）。
  llm_timeout_sec: 180

# capabilities: MCP 服务与本机扩展工具挂载、安全与可观测性。

capabilities:
  # attach_to: 挂载 MCP + RegisterLangchainTools 的 Agent 名列表；默认不含 routerAgent。
  attach_to:
    - behaviorAgent
    - execSimpleAgent
    - interactiveAgent
    - baseAgent
  mcp:
    # enabled: 是否在启动时连接下列 MCP servers。
    enabled: true
    # servers: MCP 服务列表；每项字段见下方各 server 块注释。
    servers:
      # --- MCP Server 公共字段说明（每条 server 均适用）---
      # name: 服务唯一名；对外工具名为 {name}__{tool}，如 sqlite__read_query。
      # enabled: 是否连接此 server。
      # description: 可选；写入 AGENTS.md 第一层 MCP 功能摘要。
      # transport: stdio（默认）| http（Streamable HTTP）。
      # command: stdio 可执行文件；含路径则相对 root 解析，单文件名走 PATH。
      # args: 启动参数列表。
      # env: 子进程环境变量。
      # workdir: 子进程工作目录（相对 root）。
      # tags: 审计标签（字符串数组）。
      # rate_per_minute: 该 server 下全部工具共享的每分钟调用上限；0 不限流。
      # endpoint / headers / http_max_retries / disable_standalone_sse: 仅 transport=http 时使用。

      - name: sqlite
        enabled: true
        transport: stdio
        command: "WorkSpace/mcp_bundled/mcp-sqlite/mcp-server-sqlite.exe"
        args:
          - "--db-path"
          # 数据库文件路径（相对 filesystem/工作区约定；此处相对 root）。
          - "WorkSpace/databases/savegame_template.db"
        env: {}
        workdir: ""
        rate_per_minute: 0

      - name: filesystem
        enabled: true
        transport: stdio
        command: "WorkSpace/mcp_bundled/_runtime/node-v22.13.1-win-x64/node.exe"
        args:
          - "WorkSpace/mcp_bundled/mcp-filesystem/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js"
          # 允许访问的根目录（filesystem 工具 path 相对此目录，勿再写 WorkSpace/ 前缀）。
          - "WorkSpace"
        env: {}
        workdir: "WorkSpace/mcp_bundled/mcp-filesystem"
        tags: ["bundled", "filesystem"]
        rate_per_minute: 0

      - name: resend
        enabled: true
        transport: stdio
        command: "WorkSpace/mcp_bundled/_runtime/node-v22.13.1-win-x64/node.exe"
        args:
          - "WorkSpace/mcp_bundled/mcp-resend/node_modules/resend-mcp/dist/index.js"
        env:
          # RESEND_API_KEY: Resend 平台 API Key。
          RESEND_API_KEY: ""
          # SENDER_EMAIL_ADDRESS: 发件人地址（测试可用 onboarding@resend.dev）。
          SENDER_EMAIL_ADDRESS: "onboarding@resend.dev"
        workdir: "WorkSpace/mcp_bundled/mcp-resend"
        tags: ["bundled", "email", "resend"]
        rate_per_minute: 0

      - name: python-sandbox
        description: "Python 脚本执行（数据处理/算逻辑）：execute、execute_file；默认仅在 WorkSpace 内读写，默认禁出站网络模块"
        enabled: true
        transport: stdio
        command: "WorkSpace/mcp_bundled/mcp-python-exec/mcp-python-exec.exe"
        args: []
        env:
          # PYEXEC_ENGINE: Python 解释器可执行文件（须在 PATH 或写绝对路径）。
          PYEXEC_ENGINE: "python"
          # PYEXEC_WORKDIR: 脚本读写基准目录；"." 表示 MCP 进程 cwd（workdir=WorkSpace）。
          PYEXEC_WORKDIR: "."
          # PYEXEC_RESTRICT_PATH: "1" 限制 open() 在工作区内。
          PYEXEC_RESTRICT_PATH: "1"
          # PYEXEC_DENY: 禁止 import 的模块名（逗号分隔）。
          PYEXEC_DENY: "socket,urllib,urllib3,http,httplib,ftplib,smtplib"
          # PYEXEC_DENY_PATHS: 禁止 open 的路径前缀（Windows 分号分隔）。
          PYEXEC_DENY_PATHS: "C:\\Windows;C:\\Program Files;C:\\Program Files (x86);C:\\Users"
          # PYEXEC_TIMEOUT: 单次执行超时（秒）。
          PYEXEC_TIMEOUT: "120"
        workdir: "WorkSpace"
        tags: ["bundled", "python", "sandbox"]
        rate_per_minute: 0

      - name: playwright
        description: "浏览器自动化：导航、填表、登录态、截图/录屏；非 yt-dlp 式原片下载"
        enabled: true
        transport: stdio
        command: "WorkSpace/mcp_bundled/_runtime/node-v22.13.1-win-x64/node.exe"
        args:
          - "WorkSpace/mcp_bundled/mcp-playwright/node_modules/@playwright/mcp/cli.js"
          - "--output-dir=playwright_out"
        env:
          # PLAYWRIGHT_MCP_OUTPUT_DIR: 截图/录屏输出目录（相对 workdir）。
          PLAYWRIGHT_MCP_OUTPUT_DIR: "playwright_out"
        workdir: "WorkSpace"
        tags: ["bundled", "browser", "playwright"]
        rate_per_minute: 0

      - name: documents
        description: "Office 文档：create-docx / create-pptx / create-pdf 与 read-docx / read-pptx / read-pdf；生成默认落在 WorkSpace"
        enabled: true
        transport: stdio
        command: "WorkSpace/mcp_bundled/_runtime/node-v22.13.1-win-x64/node.exe"
        args:
          - "WorkSpace/mcp_bundled/mcp-documents/node_modules/documents-mcp/dist/server/stdio.js"
        env:
          # OUTPUT_DIR: 生成文件默认目录；workdir 已是 WorkSpace 时填 "."，避免 WorkSpace/WorkSpace 双前缀。
          OUTPUT_DIR: "."
        workdir: "WorkSpace"
        tags: ["bundled", "office", "documents"]
        rate_per_minute: 0

      - name: mcp-manager
        description: "运行过程中发现原生 MCP 能力体系无法满足需求时使用。支持通过此管理门户动态安装、托管其他外部 MCP，并以『单步、无状态』的形式代理执行复杂领域的宏指令与原始数据，实现主系统能力的外生进化与风险隔离"
        enabled: true
        transport: stdio
        command: "WorkSpace/mcp_bundled/mcp-manager/mcp-manager-mcp.exe"
        workdir: "WorkSpace/mcp_bundled/mcp-manager"
        env:
          # MCP_MANAGER_DATA_DIR: 3M 托管数据与清单目录。
          MCP_MANAGER_DATA_DIR: "WorkSpace/mcp_data/mcp-manager"
          # MCP_MANAGER_CHILD_ECHO_BIN: 内置 echo 子 MCP 可执行文件（测试/代理用）。
          MCP_MANAGER_CHILD_ECHO_BIN: "WorkSpace/mcp_bundled/mcp-manager/child-echo-mcp.exe"
          # MCP_MANAGER_LLM_API_BASE: 3M 内部 LLM API 根 URL。
          MCP_MANAGER_LLM_API_BASE: "https://api.deepseek.com"
          # MCP_MANAGER_LLM_API_KEY: 3M 内部 LLM API Key。
          MCP_MANAGER_LLM_API_KEY:
          MCP_MANAGER_LLM_MODEL: "deepseek-v4-flash"
          # MCP_MANAGER_AGENT: "1" 启用 Agent 模式编排。
          MCP_MANAGER_AGENT: "1"
  security:
    # audit_log_path: MCP/工具审计 JSONL 路径；空则不写审计文件。
    audit_log_path: ""
    # mcp_max_output_chars: 单条 MCP 工具返回最大字符数；0 不截断。
    mcp_max_output_chars: 240000
    # allow_mcp_server_names: 非空时仅连接列出的 server name；空数组表示全部允许。
    allow_mcp_server_names: []
    # deny_tool_name_substrings: 对外工具名包含任一串（忽略大小写）则跳过注册。
    deny_tool_name_substrings: []
  observability:
    # enabled: 是否启用可观测性（工具调用日志等）。
    enabled: true
    # native_tool_calls: 是否在结构化日志中记录原生 tool call。
    native_tool_calls: true
    # log_tool_args_max_runes: 日志中工具参数最大 rune 数。
    log_tool_args_max_runes: 120
    # llm_chat_log_enabled: 是否将每次 Chat Completions 完整请求/响应落盘。
    llm_chat_log_enabled: true
    # llm_chat_log_dir: LLM 对话日志目录。
    llm_chat_log_dir: "WorkSpace/logs/llm_chat"
  skill_packs:
    # enabled: 是否扫描外挂能力包（roots 下含 SKILL.md 的子目录）。
    enabled: true
    # roots: 外挂包根目录列表（可多个）。
    roots:
      - "WorkSpace/skill_packs"
    # prompt_max_runes: 外挂 SKILL 注入 prompt 的最大 rune 数。
    prompt_max_runes: 4000
    # watch: 是否监视 roots 下 SKILL.md 变更并热更新 L1/L2 目录（pack 内 mcp.yaml 仍须重启）。
    watch: true
    # watch_debounce_ms: 文件监视防抖毫秒。
    watch_debounce_ms: 1500
