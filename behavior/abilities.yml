  - name: "WebApi_Domain"
    description: "处理所有外部网络请求与实时情报搜集"
    abilities:
      - name: "SearchInf"
        description: "智能联网信息搜集"
        skills:
          - name: "AI_Search_Skill_By_Qwen3-Max"
            description: "通过连接高级 AI 搜索引擎获取经过提炼的实时信息，自带联网增强"
            input_schema:
              A_query: "string (Required, 搜索的关键词或问题)"
              B_detail_level: "string (Optional, brief/detailed. 默认为 detailed)"
            output_schema:
              A_status: "string (success/fail)"
              B_answer: "string (提炼后的搜索答案内容)"

